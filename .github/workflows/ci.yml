name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        # The repository root holds only PLAN.MD and this directory, so
        # every run step works from inside the project. Without it
        # requirements.txt is not found and `app` is not importable.
        # `uses:` steps ignore this, which is why the pip cache path below
        # is written out in full.
        working-directory: tech-intel-agent

    env:
      # DUMMY VALUES ONLY. NEVER PUT A REAL CREDENTIAL IN THIS FILE.
      #
      # A workflow file is tracked by git, so a real key here is committed
      # permanently - into every clone and fork, past any history rewrite,
      # and around the .gitignore that keeps .env out for exactly this
      # reason. If a job ever genuinely needs a live credential, add it as
      # a repository secret and reference it as ${{ secrets.NAME }}, which
      # GitHub masks in logs.
      #
      # Nothing in this job connects to anything. The import check only
      # needs Settings to VALIDATE, not connect —
      # config.py fails at import time if a required field is missing, which is exactly
      # the class of bug this job exists to catch.
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci_news
      CONVERSATION_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci_conv
      REDIS_URL: redis://localhost:6379/0
      GEMINI_API_KEYS: dummy-key-1,dummy-key-2
      GROQ_API_KEY: dummy-groq-key
      VOYAGE_API_KEY: dummy-voyage-key
      TAVILY_API_KEY: dummy-tavily-key
      TELEGRAM_BOT_TOKEN: dummy-telegram-token
      # Must be false — observability.py raises at startup if tracing is on without a key
      LANGCHAIN_TRACING_V2: "false"
      # Empty, not a real DSN. A live DSN here makes the import check
      # initialise Sentry and ship CI events to the production project -
      # the same failure tests/conftest.py exists to prevent.
      SENTRY_DSN: ""
      ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tech-intel-agent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The single highest-value check. The package was once entirely unimportable —
      # a non-annotated attribute in config.py crashed Pydantic at class-definition
      # time — and nothing caught it. This one line does.
      #
      # It also covers ground pytest does not: no test imports the sender or the
      # agents, so a syntax error there passes the suite untouched. That has already
      # happened once — a mangled escape left an unterminated string in
      # batch_sender.py and every test still went green.
      #
      # SENTRY_DSN and LANGCHAIN_TRACING_V2 are set in env above rather than relying
      # on tests/conftest.py, because this step runs outside pytest and conftest is
      # never loaded for it.
      - name: Import check
        run: python -c "import app.pipeline_main, app.responder.main; print('imports OK')"

      - name: Run tests
        # `python -m pytest` rather than bare `pytest`: it puts the working directory
        # on sys.path, so `app` resolves the same way it does for the import check
        # above instead of depending on pytest's rootdir inference.
        run: python -m pytest -v
