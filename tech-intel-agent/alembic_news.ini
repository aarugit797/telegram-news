; Alembic config for the NEWS database ONLY.
;
;   alembic -c alembic_news.ini revision --autogenerate -m "..."
;   alembic -c alembic_news.ini upgrade head
;
; The Conversation DB has its own config: alembic_conversation.ini.
; Run from the tech-intel-agent/ directory.

[alembic]
script_location = alembic/news
prepend_sys_path = .

; Date-prefixed filenames so the two independent version histories stay
; readable at a glance.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

; Deliberately blank. alembic/news/env.py sets this at runtime from
; app.core.config.settings.database_url, so the real credentials live in
; .env (gitignored) and never in this tracked file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
