services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: techintel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: techintel
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: techintel_news
    ports:
      # Bound to loopback, not 0.0.0.0. A bare "5432:5432" publishes
      # the container on every interface, which on a cloud host means
      # the open internet - and this service has no auth beyond a
      # password that lives in a local .env. Localhost access for
      # development is unchanged.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-second-db.sh:/docker-entrypoint-initdb.d/init-second-db.sh

  redis:
    image: redis:7-alpine
    container_name: techintel_redis
    restart: unless-stopped
    ports:
      # Bound to loopback, not 0.0.0.0. A bare "6379:6379" publishes
      # the container on every interface, which on a cloud host means
      # the open internet - and this service has no auth beyond a
      # password that lives in a local .env. Localhost access for
      # development is unchanged.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
