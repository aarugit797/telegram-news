services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: techintel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: techintel
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: techintel_news
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-second-db.sh:/docker-entrypoint-initdb.d/init-second-db.sh

  redis:
    image: redis:7-alpine
    container_name: techintel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
